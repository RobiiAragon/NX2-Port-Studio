name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nx2:
    name: NX2 inputs and Ampere / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'macOS'
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-nx2.txt
      - run: make -C native
      - name: Synthetic Switch 2 inputs and offline shader cases
        # The locked translator is osx-arm64; its semantic regression runs on
        # Apple Silicon. Native lowering/parser cases run on both platforms.
        run: python -m unittest discover -s nx2/tests -v
      - name: Shader-chain identity and native source attestation
        run: python -m unittest dm.tools.tests.test_nsp_chain dm.tools.tests.test_nvn2_chain -v
      - name: Native NVN2 state codecs
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -I dm/gfx/nvn/include dm/gfx/tests/t_nvn2_state.c -o "${{ runner.temp }}/t_nvn2_state"
          "${{ runner.temp }}/t_nvn2_state"
      - name: Guest page size and memory mapping regressions
        if: runner.os == 'macOS'
        run: make -C dm/host/tests memory memory-profile
      - name: HID service and transfer-memory ownership
        if: runner.os == 'macOS'
        run: make -C dm/host/tests hid-service hid-service-sanitize
      - name: NVN2 resource fixtures build and CPU object layouts
        if: runner.os == 'macOS'
        run: |
          make -C dm/gfx/tests t_nvn2_abi t_nvn2_vpool t_nvn2_alias GAME=0100152000022000
          ./dm/gfx/tests/t_nvn2_abi
  studio:
    name: Studio / macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: PortCore tests
        run: swift test --package-path macOS/NXPortStudio
      - name: Studio build
        run: swift build --package-path macOS/NXPortStudio --product NX2PortStudio
      - name: Package independent NX2 app
        run: bash scripts/package_nx2_studio.sh "${{ runner.temp }}/NX2 Port Studio.app"
      - name: Verify signed bundle after synthetic import
        run: python3 scripts/check_nx2_bundle.py "${{ runner.temp }}/NX2 Port Studio.app"
  tools:
    name: Asset-free Python checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Documentation and source-only tool tests
        run: >-
          python -m unittest
          dm.tools.tests.test_docs
          dm.tools.tests.test_nso_syms
          dm.tools.tests.test_system_data
          dm.tools.tests.test_launcher_settings
          dm.ios.tests.test_launcher_storage
          dm.ios.tests.test_mobile_nextendo
          dm.ios.tests.test_nextendo_resources
          tools.maintainers.test_prepare_export
  networking:
    name: Local network fixtures / macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Discovery transport and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py discovery
      - name: Discovery relay and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py relay
      - name: Local play-history service and sanitizers
        run: python3 tools/maintainers/ci_network_checks.py friends-history
  native-network:
    name: Pinned Switch 2 LAN and LDN / macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: seedds/nxnative
          ref: 1d4b8e82bcbae79fe10164d210779a4060b61605
          path: .nx2-build/native-network-engine
          persist-credentials: false
      - run: python -m pip install -r requirements-nx2.txt
      - name: Apply attested host sources and exercise actual providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ASAN_OPTIONS: halt_on_error=1:detect_stack_use_after_return=1:use_sigaltstack=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python tools/maintainers/check_native_network.py .nx2-build/native-network-engine
  firmware-tools:
    name: Firmware parser / synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Bounded firmware resource extraction
        run: dotnet run --project dm/tools/tests/friends_firmware_fixture/FriendsFirmwareTests.csproj --configuration Release
